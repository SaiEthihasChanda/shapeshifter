# Builds the Windows installer from a version tag, sends it to SignPath for signing, and publishes a GitHub release.
# NOT YET RUN: written without access to GitHub Actions, so expect small fixes on the first run.
# Needs (see docs/CODE-SIGNING.md): secret SIGNPATH_API_TOKEN; variables SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Inno Setup and ffmpeg
        shell: pwsh
        run: |
          choco install innosetup ffmpeg -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - name: Build
        shell: pwsh
        run: .\build.ps1 -PythonExe (Get-Command python).Source
      - name: Package the installer for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item (Get-ChildItem dist\ShapeShifter-Setup-*.exe | Where-Object { $_.Name -ne 'ShapeShifter-Setup.exe' } | Select-Object -First 1) unsigned\
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: unsigned/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-extras
          path: |
            dist/shapeshifter-*-source.zip

  sign:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/download-artifact@v4
        with:
          name: release-extras
          path: extras
      - name: Checksums and release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem signed\ShapeShifter-Setup-*.exe | Select-Object -First 1
          Copy-Item $setup.FullName signed\ShapeShifter-Setup.exe
          $src = Get-ChildItem extras -Recurse -Filter *-source.zip | Select-Object -First 1
          $lines = foreach ($f in @($setup, $src)) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          Set-Content signed\SHA256SUMS.txt $lines -Encoding ascii
          $tag = "${{ github.ref_name }}"
          gh release create $tag signed\*.exe signed\SHA256SUMS.txt $src.FullName --title "ShapeShifter $($tag.TrimStart('v'))" --notes-file "docs\release-notes-$($tag.TrimStart('v')).md"
